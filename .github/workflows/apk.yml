# Empaqueta la web con Capacitor (archivos dentro del APK, funciona offline) y la publica en Releases.
# Se dispara al subir un tag v* (ej.: git tag v1.0.0 && git push origin v1.0.0).
name: APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Proyecto Capacitor
        run: |
          mkdir -p build/www && cp -r index.html sw.js src build/www/
          cd build
          npm init -y >/dev/null
          npm i @capacitor/cli@6.2.0 @capacitor/core@6.2.0 @capacitor/android@6.2.0
          npx cap init Compra py.yosoymitxel.compra --web-dir www
          npx cap add android
      - name: Compilar
        run: cd build/android && ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../../compra.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: compra.apk
