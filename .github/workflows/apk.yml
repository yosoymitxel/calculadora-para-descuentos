# Empaqueta la web con Capacitor (archivos dentro del APK, funciona offline) y la publica en Releases.
# Cada push a main publica un release nuevo (v1.0.<n>).
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Proyecto Capacitor
        run: |
          mkdir -p build/www && cp -r index.html sw.js src build/www/
          sed -i 's/data-build=""/data-build="${{ github.run_number }}"/' build/www/index.html
          cd build
          npm init -y >/dev/null
          npm i @capacitor/cli@6.2.0 @capacitor/core@6.2.0 @capacitor/android@6.2.0
          npx cap init Compra py.yosoymitxel.compra --web-dir www
          npx cap add android
      # La clave vive en secretos del repo (ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD). Siempre la misma:
      # Android solo instala una actualización firmada con la clave de la versión instalada.
      - name: Compilar y firmar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Faltan los secretos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          # Al pegar los secretos suele colarse un salto de línea o espacio: se quitan.
          export KEYSTORE_PASSWORD="$(printf %s "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf %s "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias compra >/dev/null || { echo "::error::ANDROID_KEYSTORE_PASSWORD no abre ANDROID_KEYSTORE_B64 (¿secretos invertidos o incompletos?)"; exit 1; }
          cd build/android
          sed -i "0,/^android {/s||android {\n    signingConfigs { release { storeFile file(System.getenv('KEYSTORE_PATH')); storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias 'compra'; keyPassword System.getenv('KEYSTORE_PASSWORD') } }|" app/build.gradle
          sed -i -E 's/^( *)release \{/&\n\1    signingConfig signingConfigs.release/' app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../compra.apk
          keytool -printcert -jarfile ../../compra.apk | grep -qF "$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | grep -m1 SHA256:)"
          rm -f "$KEYSTORE_PATH"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: compra.apk
