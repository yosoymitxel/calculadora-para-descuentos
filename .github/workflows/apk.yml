# Empaqueta la web con Capacitor (archivos dentro del APK, funciona offline) y la publica en Releases.
# Cada push a main publica un release nuevo (v1.0.<n>).
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Proyecto Capacitor
        run: |
          mkdir -p build/www && cp -r index.html sw.js src build/www/
          sed -i 's/data-build=""/data-build="${{ github.run_number }}"/' build/www/index.html
          cd build
          npm init -y >/dev/null
          npm i @capacitor/cli@6.2.0 @capacitor/core@6.2.0 @capacitor/android@6.2.0
          npx cap init Compra py.yosoymitxel.compra --web-dir www
          npx cap add android
      # Misma clave en cada compilación: sin ella Android rechaza instalar la versión nueva encima de la anterior.
      - name: Compilar
        run: |
          mkdir -p ~/.android && cp android/debug.keystore ~/.android/debug.keystore
          cd build/android
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle
          ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../../compra.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: compra.apk
